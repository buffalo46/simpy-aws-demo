<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production Line Sim</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: flex; justify-content: space-between; margin: .5rem 0; }
    input { width: 6rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Production line</h1>
  <p>Jobs go through Cut → Assemble → Test. Pick machines per station and run.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('run') }}">
    {% for name, mean in stations.items() %}
      <label>{{ name }} machines ({{ mean }} min each)
        <input type="number" name="machines_{{ name }}" min="1" max="20"
               value="{{ values.machines[name] }}"></label>
    {% endfor %}
    <label>Arrivals per hour
      <input type="number" name="arrivals_per_hour" step="0.1" value="{{ values.arrivals_per_hour }}"></label>
    <label>Hours to simulate
      <input type="number" name="hours" step="1" value="{{ values.hours }}"></label>
    <button type="submit">Run</button>
  </form>
</body>
</html>
